# @jbrowse/core 4.3.0 still depends on mst 5 / mobx 6, but react-msaview 5.7.1
# (and jbrowse v5, which this plugin targets) are on mst 6 / mobx 7. Without
# these, both majors land in the tree and every model type crossing the
# @jbrowse/core boundary fails to typecheck as a nominal v5-vs-v6 mismatch.
# Drop these once @jbrowse/core v5 is published.
overrides:
  '@jbrowse/mobx-state-tree': ^6.1.0
  mobx: ^7.0.0
  mobx-react: ^10.0.0

allowBuilds:
  esbuild: true
  puppeteer: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@jbrowse/mobx-state-tree'
  - 'react-msaview'
  - 'msa-parsers'
  - '@jbrowse/svgcanvas@5.6.1'
