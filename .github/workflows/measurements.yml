# Checks that the numbers written into README.md are still what the data
# measures.
#
# Not part of Integration and not part of `preversion`: it fetches tens of
# megabytes from GIAB and the UCSC API, so it fails on anything from an FTP
# outage to a UCSC deprecation, and neither is a reason a commit cannot land or
# a release cannot go out. Weekly, and on demand, is enough to notice that the
# README has stopped describing the data — which is the only failure it is
# looking for, since the measurement itself is pinned by the unit tests.
name: Measurements

on:
  schedule:
    # Mondays, early UTC
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    # the sources of the numbers: if one of these changed, the README may have
    # to as well, and this is the only thing that can say so
    paths:
      - 'src/LaunchTView/**'
      - 'scripts/lib/**'
      - 'scripts/repeat-readme.mjs'
      - '.github/workflows/measurements.yml'

jobs:
  readme:
    name: README matches the measurements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check README against live GIAB data
        run: pnpm readme:repeats --check
